# Piedalera settings. Turn into a flashable file with:
#   python3 tools/config2uf2.py config/piedalera.ini piedalera-config.uf2
# See docs/configuration.md for every key and its range.

display.width      = 128
display.height     = 32
display.col_offset = 4
display.brightness = 15
display.splash     = true
display.dim_s      = 60
display.off_s      = 300

midi.channel       = 1
midi.velocity      = 95
midi.transpose     = 0
midi.sound         = 0

octave.min         = 0
octave.max         = 7
octave.current     = 3
octave.delay_ms    = 100
octave.repeat_ms   = 500

keys.active_low    = true
keys.pull          = none
keys.debounce_ms   = 5

power.sleep_s      = 600
power.battery      = li-ion
power.cells        = 1
power.drop_mv      = 300

expression.enabled = false
expression.cc      = 11
expression.invert  = false
expression.min     = 4095
expression.max     = 0

# Sounds picked with G and A in config mode: bank select (CC0, CC32), program
# (1-128) and a name of up to 15 characters. These are General MIDI sounds,
# bank 0 0 on the Yamaha MU5; see your synth's manual for its own banks.
sound = 0 0   1 Grand Piano
sound = 0 0   5 E.Piano
sound = 0 0   7 Harpsichord
sound = 0 0  22 Accordion
sound = 0 0  18 Perc. Organ
sound = 0 0  20 Church Organ
sound = 0 0  53 Choir
sound = 0 0  49 Strings
sound = 0 0  62 Brass
sound = 0 0  91 Polysynth
sound = 0 0  15 Tubular Bells
sound = 0 0 102 Goblin
