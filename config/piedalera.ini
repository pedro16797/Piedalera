# Piedalera settings. Turn into a flashable file with:
#   python3 tools/config2uf2.py config/piedalera.ini piedalera-config.uf2
# See docs/configuration.md for every key and its range.

display.width      = 128
display.height     = 32
display.col_offset = 4
display.brightness = 15
display.splash     = true
display.dim_s      = 60
display.off_s      = 300

midi.channel       = 1
midi.velocity      = 95
midi.transpose     = 0
midi.bank_lsb      = 12

octave.min         = 0
octave.max         = 7
octave.current     = 3
octave.delay_ms    = 100
octave.repeat_ms   = 500

keys.active_low    = true
keys.pull          = none
keys.debounce_ms   = 5

power.sleep_s      = 600
power.battery      = li-ion
power.cells        = 1
power.drop_mv      = 300
